<div style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:#fbf5ef;padding:24px">
  <div style="max-width:520px;margin:auto;background:#fff;border-radius:20px;padding:32px;color:#3a2230">
    <p style="font-family:Georgia,serif;font-size:22px;color:#6b1f3f;margin:0 0 16px">Atelier Sucré</p>
    <h1 style="font-family:Georgia,serif;color:#6b1f3f;font-size:24px">Confirmez votre adresse e-mail</h1>
    <p>Bienvenue ! Cliquez sur le bouton ci-dessous pour activer votre compte et créer votre atelier.</p>
    <p style="margin:28px 0">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&suivant=/bienvenue"
         style="background:#6b1f3f;color:#fff;text-decoration:none;padding:14px 26px;border-radius:999px;font-weight:600">
        Activer mon compte
      </a>
    </p>
    <p style="font-size:13px;color:#8a6f7c">Vous pouvez ouvrir ce lien sur n'importe quel appareil. Si vous n'êtes pas à l'origine de cette inscription, ignorez cet e-mail.</p>
  </div>
</div>
